name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore VisualStudio.CSharpNavigatorMcp.sln
      - name: Build
        run: dotnet build VisualStudio.CSharpNavigatorMcp.sln -c Release --no-restore -v:minimal
      - name: Server tests
        run: dotnet test tests/VisualStudio.CSharpNavigator.Server.Tests/VisualStudio.CSharpNavigator.Server.Tests.csproj -c Release --no-build --no-restore -v:minimal
